<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ZH WebEdition (inoffiziell, GPLv3) — Render Proof</title>
  <style>
    html,body{margin:0;height:100%;background:#0a0a12;overflow:hidden;}
    #wrap{display:flex;align-items:center;justify-content:center;height:100%;}
    canvas{width:80vw;height:80vh;background:#000;border:1px solid #333;}
    #status{position:fixed;top:8px;left:8px;color:#7cf;font:13px monospace;}
  </style>
</head>
<body>
  <div id="status">Lade WebAssembly…</div>
  <div id="wrap">
    <canvas id="canvas" width="800" height="600"></canvas>
  </div>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      onRuntimeInitialized: function() {
        document.getElementById('status').textContent = "WASM bereit — zeichne Dreieck…";
        Module.ccall('run_render_proof', null, [], []);
        document.getElementById('status').textContent = "✓ Dreieck gerendert (WebGL2 / WASM)";
      },
      onAbort: function(e){ document.getElementById('status').textContent = "Fehler: " + e; }
    };
  </script>
  <script src="zh_webproof.js"></script>
</body>
</html>
