<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ZH WebEdition (inoffiziell, GPLv3) — Render Proof</title>
  <style>
    html,body{margin:0;height:100%;background:#0a0a12;overflow:hidden;}
    #wrap{display:flex;align-items:center;justify-content:center;height:100%;}
    canvas{width:80vw;height:80vh;background:#000;border:1px solid #333;}
    #status{position:fixed;top:8px;left:8px;color:#7cf;font:13px monospace;white-space:pre-wrap;max-width:90vw;}
  </style>
</head>
<body>
  <div id="status">Lade WebAssembly…</div>
  <div id="wrap">
    <canvas id="canvas" width="800" height="600"></canvas>
  </div>
  <script>
    var out = "";
    var Module = {
      canvas: "canvas",   // Canvas-ID als String (nicht Element) -> Emscripten kompatibel
      print: function(t){ out += t + "\n"; document.getElementById('status').textContent = out; },
      printErr: function(t){ out += "ERR: " + t + "\n"; document.getElementById('status').textContent = out; },
      onRuntimeInitialized: function() {
        try {
          Module.ccall('run_render_proof', null, [], []);
          out += "✓ run_render_proof aufgerufen\n";
        } catch(e) {
          out += "EXCEPTION: " + e + "\n";
        }
        document.getElementById('status').textContent = out;
      },
      onAbort: function(e){ out += "ABORT: " + e + "\n"; document.getElementById('status').textContent = out; }
    };
  </script>
  <script src="zh_webproof.js"></script>
</body>
</html>
