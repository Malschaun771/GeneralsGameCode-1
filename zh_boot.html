<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ZH WebEdition (inoffiziell, GPLv3) — Boot Harness</title>
  <style>
    html,body{margin:0;height:100%;background:#0a0a12;overflow:hidden;}
    #wrap{display:flex;align-items:center;justify-content:center;height:100%;}
    canvas{width:80vw;height:80vh;background:#000;border:1px solid #333;}
    #status{position:fixed;top:8px;left:8px;color:#7cf;font:13px monospace;white-space:pre-wrap;max-width:90vw;}
  </style>
</head>
<body>
  <div id="status">Lade WebAssembly…</div>
  <div id="wrap"><canvas id="canvas" width="800" height="600"></canvas></div>
  <script>
    var out = "";
    function log(t){ out += t + "\n"; var s=document.getElementById('status'); if(s) s.textContent = out; }
    var Module = {
      canvas: "canvas",
      print: function(t){ log(t); },
      printErr: function(t){ log("ERR: " + t); },
      postRun: function() { log("RUNTIME READY (postRun)"); },
      onAbort: function(e){ log("ABORT: " + e); document.title="ABORT:"+e; }
    };
  </script>
  <script src="zh_boot.js"></script>
</body>
</html>
